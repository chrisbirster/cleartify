version: '3'

env:
  PATH:
    sh: 'printf "%s/.bun/bin:/opt/homebrew/bin:%s" "$HOME" "$PATH"'

tasks:
  build:env:
    desc: Create a local .env file for WorkOS-based app development
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists at $(pwd)/.env"
          echo "Edit WORKOS_API_KEY and WORKOS_CLIENT_ID there, or remove it and rerun task build:env."
          exit 0
        fi

        cookie_secret="$(openssl rand -base64 32 2>/dev/null || printf 'replace-with-a-random-secret')"

        cat > .env <<EOF
        PORT=8000
        DATABASE_PATH=.tasktmp/dev.sqlite.db
        APP_PUBLIC_URL=http://localhost:3000
        APP_MARKETING_URL=http://localhost:4173
        AUTH_MODE=workos
        SEED_DEMO=true

        WORKOS_API_KEY=
        WORKOS_CLIENT_ID=
        WORKOS_REDIRECT_URI=http://localhost:3000/auth/callback
        WORKOS_COOKIE_PASSWORD=${cookie_secret}

        VITE_APP_ORIGIN=http://localhost:3000
        EOF

        echo "Created .env at $(pwd)/.env"
        echo "Next: fill in WORKOS_API_KEY and WORKOS_CLIENT_ID, then run task app:dev, task web:dev, and task marketing:dev."

  _ports:check:sqlite:
    internal: true
    desc: Ensure local sqlite dev ports are available
    cmds:
      - |
        for port in 3000 4173 8000; do
          listeners="$(lsof -iTCP:$port -sTCP:LISTEN -n -P 2>/dev/null || true)"
          if [ -n "$listeners" ]; then
            echo "Port $port is already in use."
            echo "$listeners"
            exit 1
          fi
        done
        exit 0

  _ports:check:sqlite:app:
    internal: true
    desc: Ensure local sqlite app ports are available
    cmds:
      - |
        for port in 3000 8000; do
          listeners="$(lsof -iTCP:$port -sTCP:LISTEN -n -P 2>/dev/null || true)"
          if [ -n "$listeners" ]; then
            echo "Port $port is already in use."
            echo "$listeners"
            exit 1
          fi
        done
        exit 0

  bootstrap:
    desc: Install Go and Bun dependencies for app, marketing, and infra
    cmds:
      - go mod download
      - cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun install
      - cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun install
      - cd infra && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun install
      - cd infra && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bunx sst install

  app:dev:
    desc: Run the Go app locally
    cmds:
      - |
        set -a
        [ -f ./.env ] && . ./.env || true
        PORT=${PORT:-8000}
        APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
        APP_MARKETING_URL=${APP_MARKETING_URL:-http://localhost:4173}
        DATABASE_PATH=${DATABASE_PATH:-.tasktmp/dev.sqlite.db}
        SEED_DEMO=${SEED_DEMO:-true}
        APP_SERVER_ORIGIN=${APP_SERVER_ORIGIN:-http://localhost:${PORT}}
        VITE_APP_ORIGIN=${VITE_APP_ORIGIN:-http://localhost:3000}
        set +a
        echo "Cleartify API: http://localhost:${PORT}"
        go run ./cmd/cleartify

  web:dev:
    desc: Run the Vite app shell at http://localhost:3000
    cmds:
      - |
        set -a
        [ -f ./.env ] && . ./.env || true
        set +a
        cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev

  marketing:dev:
    desc: Run the marketing site at http://localhost:4173
    cmds:
      - |
        set -a
        [ -f ./.env ] && . ./.env || true
        set +a
        cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev

  dev:sqlite:app:
    desc: Run the Go app and app frontend locally against SQLite
    cmds:
      - task: _ports:check:sqlite:app
      - task: build:app-web
      - |
        mkdir -p .tasktmp
        rm -f .tasktmp/dev.sqlite.db .tasktmp/dev.sqlite.db-shm .tasktmp/dev.sqlite.db-wal
        set -a
        [ -f ./.env ] && . ./.env || true
        PORT=8000
        APP_PUBLIC_URL=http://localhost:3000
        APP_MARKETING_URL=http://localhost:4173
        AUTH_MODE=demo
        DATABASE_PATH=.tasktmp/dev.sqlite.db
        SEED_DEMO=true
        WORKOS_REDIRECT_URI=http://localhost:3000/auth/callback
        APP_SERVER_ORIGIN=http://localhost:8000
        VITE_APP_ORIGIN=http://localhost:3000
        set +a
        echo "Cleartify API: http://localhost:8000"
        echo "Cleartify app: http://localhost:3000/"
        trap 'kill 0' EXIT
        go run ./cmd/cleartify &
        ready=false
        for _ in $(seq 1 120); do
          if curl -fsS "http://localhost:8000/api/health" >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 0.25
        done
        if [ "$ready" != "true" ]; then
          echo "Cleartify API did not become ready on http://localhost:8000 within 30s."
          exit 1
        fi
        (cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev) &
        wait

  dev:sqlite:
    desc: Run backend, app frontend, and marketing locally against SQLite
    cmds:
      - task: _ports:check:sqlite
      - task: build:app-web
      - |
        mkdir -p .tasktmp
        rm -f .tasktmp/dev.sqlite.db .tasktmp/dev.sqlite.db-shm .tasktmp/dev.sqlite.db-wal
        set -a
        [ -f ./.env ] && . ./.env || true
        PORT=8000
        APP_PUBLIC_URL=http://localhost:3000
        APP_MARKETING_URL=http://localhost:4173
        AUTH_MODE=demo
        DATABASE_PATH=.tasktmp/dev.sqlite.db
        SEED_DEMO=true
        WORKOS_REDIRECT_URI=http://localhost:3000/auth/callback
        APP_SERVER_ORIGIN=http://localhost:8000
        VITE_APP_ORIGIN=http://localhost:3000
        set +a
        echo "Cleartify API: http://localhost:8000"
        echo "Cleartify app: http://localhost:3000/"
        echo "Cleartify marketing: http://localhost:4173/"
        trap 'kill 0' EXIT
        go run ./cmd/cleartify &
        ready=false
        for _ in $(seq 1 120); do
          if curl -fsS "http://localhost:8000/api/health" >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 0.25
        done
        if [ "$ready" != "true" ]; then
          echo "Cleartify API did not become ready on http://localhost:8000 within 30s."
          exit 1
        fi
        (cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev) &
        (cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev) &
        wait

  dev:e2e:
    desc: Run backend, app frontend, and marketing using the current .env (for WorkOS/e2e flows)
    cmds:
      - task: _ports:check:sqlite
      - task: build:app-web
      - |
        mkdir -p .tasktmp
        set -a
        [ -f ./.env ] && . ./.env || true
        PORT=${PORT:-8000}
        APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
        APP_MARKETING_URL=${APP_MARKETING_URL:-http://localhost:4173}
        DATABASE_PATH=${DATABASE_PATH:-.tasktmp/dev.sqlite.db}
        SEED_DEMO=${SEED_DEMO:-true}
        WORKOS_REDIRECT_URI=${WORKOS_REDIRECT_URI:-${APP_PUBLIC_URL}/auth/callback}
        APP_SERVER_ORIGIN=${APP_SERVER_ORIGIN:-http://localhost:${PORT}}
        VITE_APP_ORIGIN=${VITE_APP_ORIGIN:-${APP_PUBLIC_URL}}
        set +a
        echo "Cleartify API: http://localhost:${PORT}"
        echo "Cleartify app: ${APP_PUBLIC_URL}/"
        echo "Cleartify marketing: ${APP_MARKETING_URL}/"
        echo "Auth mode: ${AUTH_MODE:-workos}"
        trap 'kill 0' EXIT
        go run ./cmd/cleartify &
        ready=false
        for _ in $(seq 1 120); do
          if curl -fsS "${APP_SERVER_ORIGIN}/api/health" >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 0.25
        done
        if [ "$ready" != "true" ]; then
          echo "Cleartify API did not become ready on ${APP_SERVER_ORIGIN} within 30s."
          exit 1
        fi
        (cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev) &
        (cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run dev) &
        wait

  dev:
    desc: Run backend plus app frontend against SQLite
    cmds:
      - task: dev:sqlite:app

  dev:full:
    desc: Run backend, app frontend, and marketing frontend against SQLite
    cmds:
      - task: dev:sqlite

  build:app-web:
    desc: Build the embedded web app into web/dist
    cmds:
      - cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run build

  build:marketing:
    desc: Build the marketing site into marketing/dist
    cmds:
      - cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run build

  build:server:
    desc: Build the Go server binary with embedded web assets
    deps: [build:app-web]
    cmds:
      - mkdir -p bin
      - go build -o bin/cleartify ./cmd/cleartify

  build:
    desc: Build marketing, embedded app web assets, and server
    deps: [build:marketing, build:server]

  test:go:
    desc: Run Go tests
    cmds:
      - go test ./...

  test:web:
    desc: Run web unit tests
    cmds:
      - cd web && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run test:coverage

  test:
    desc: Run Go and web tests
    deps: [test:go, test:web]

  debug:session:
    desc: Call the session endpoint with a cookie jar for local debugging
    cmds:
      - |
        set -a
        [ -f ./.env ] && . ./.env || true
        set +a
        mkdir -p .tasktmp
        curl -i --cookie-jar .tasktmp/session.cookies "${APP_SERVER_ORIGIN:-http://localhost:8000}/api/auth/session"

  deploy:fly:
    desc: Deploy the app server to Fly.io
    cmds:
      - fly deploy --remote-only --app ${FLY_APP:-cleartify-app}

  deploy:marketing:
    desc: Build and push the marketing site to Cloudflare Pages via Wrangler
    cmds:
      - cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bun run build
      - cd marketing && PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH" bunx wrangler pages deploy dist --project-name ${cleartify_MARKETING_PAGES_PROJECT}

  deploy:
    desc: Deploy Fly app and marketing site
    cmds:
      - task: deploy:fly
      - task: deploy:marketing
