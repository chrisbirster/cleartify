name: local-browser-e2e
on:
  pull_request:
    branches: [dev, main, feat/clear-live-frontend-20261027]
  push:
    branches: ['feat/local-browser-playwright-*']
jobs:
  chromium-local:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURSO_GO_CACHE_DIR: /tmp/turso-go-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: mkdir -p .local && go build -buildvcs=false -o .local/cleartify-e2e ./cmd/cleartify
      - run: bash scripts/run-local-browser-e2e.sh
      - name: Upload screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clear-responsive-browser-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
