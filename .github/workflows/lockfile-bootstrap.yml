name: lockfile bootstrap (one-shot)
on:
  push:
    branches:
      - 'feat/m1-reproducible-build-20261013'
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: github.repository == 'chrisbirster/cleartify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Generate and validate npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/lockfile-bootstrap.yml
          git commit -m "build: commit npm lockfile generated with Node 24"
          git push origin HEAD:feat/m1-reproducible-build-20261013
