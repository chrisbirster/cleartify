name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - dev
      - main
      - 'feat/**'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: bash scripts/check-release-sha.sh "$GITHUB_SHA"
      - run: npm ci
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    env:
      TURSO_GO_CACHE_DIR: /tmp/turso-go-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: bash scripts/check-release-sha.sh "$GITHUB_SHA"
      - run: go mod download
      - run: go mod verify
      # Turso's embedded native library is extracted into one cache path.
      # Serialize package tests so separate test processes cannot race the first extraction.
      - run: go test -p 1 ./...
      - run: go build ./cmd/cleartify
      - run: docker build -t cleartify-ci .
