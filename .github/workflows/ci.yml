name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - dev
      - main
      - 'feat/**'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go mod download
      - run: go test ./...
      - run: go build ./cmd/cleartify
      - run: docker build -t cleartify-ci .
