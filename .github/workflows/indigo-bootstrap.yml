name: Indigo dependency lock (temporary)
on:
  push:
    branches:
      - feat/m2-indigo-oauth-login-20261012
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Pin SDK and validate module
        run: |
          go get github.com/bluesky-social/indigo/atproto/auth/oauth@b2619d864df0
          go mod tidy
          go mod verify
      - name: Save generated go.mod and go.sum and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git rm .github/workflows/indigo-bootstrap.yml
          git commit -m "build(m2): pin verified Indigo OAuth SDK"
          git push origin HEAD:feat/m2-indigo-oauth-login-20261012
